<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prime Store Mobil</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #000; color: white; overflow: hidden; }
        
        /* Kamera Arka Planda Tam Ekran */
        #video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover; }
        
        /* Arayüz Katmanı */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        
        .header { background: rgba(0,0,0,0.6); padding: 15px; text-align: center; pointer-events: auto; }
        .footer { background: white; color: black; padding: 20px; border-radius: 20px 20px 0 0; pointer-events: auto; max-height: 40%; overflow-y: auto; }
        
        .scan-box { width: 250px; height: 150px; border: 2px solid #00ff00; margin: auto; position: relative; box-shadow: 0 0 20px rgba(0,255,0,0.5); }
        .scan-line { width: 100%; height: 2px; background: red; position: absolute; top: 0; animation: move 2s linear infinite; }
        
        @keyframes move { 0% {top: 0;} 100% {top: 100%;} }
        
        .product-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .total-row { font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; margin-top: 10px; color: #1a73e8; }
        
        button { background: #1a73e8; color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 10px; font-size: 16px; }
    </style>
</head>
<body>

<video id="video"></video>

<div class="ui-layer">
    <div class="header">
        <h2 style="margin:0;">PRIME STORE 🏪</h2>
        <small id="status">Kamera Hazırlanıyor...</small>
    </div>

    <div class="scan-box">
        <div class="scan-line"></div>
    </div>

    <div class="footer">
        <div id="cart-list">
            <p style="text-align:center; color:#888;">Henüz ürün taranmadı...</p>
        </div>
        <div class="total-row">
            <span>TOPLAM:</span>
            <span id="total-price">0 TL</span>
        </div>
        <button onclick="window.print()">FİŞİ YAZDIR</button>
        <button onclick="clearCart()" style="background:#eee; color:#333; font-size:12px; padding:5px; margin-top:5px;">Sepeti Boşalt</button>
    </div>
</div>

<script>
    // ÜRÜN VERİTABANI
    const urunler = {
        "01": { ad: "Sakız", fiyat: 5 },
        "02": { ad: "Hot Wheels", fiyat: 120 },
        "03": { ad: "İçecek", fiyat: 25 }
    };

    let sepet = [];
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let isScanning = true;

    // Kamerayı Başlat (Arka Kamera)
    codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
        if (result && isScanning) {
            isScanning = false; // Aynı ürünü defalarca okumasın
            const kod = result.text;
            
            if (urunler[kod]) {
                if (navigator.vibrate) navigator.vibrate(100); // Telefonu titret
                addToCart(urunler[kod]);
            }
            
            // 2 saniye sonra tekrar taramaya hazır ol
            setTimeout(() => { isScanning = true; }, 2000);
        }
        if (err) document.getElementById('status').innerText = "Tarama Aktif...";
    });

    function addToCart(urun) {
        sepet.push(urun);
        renderCart();
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        const totalDisp = document.getElementById('total-price');
        list.innerHTML = "";
        let total = 0;

        sepet.forEach(item => {
            list.innerHTML += `<div class="product-item"><span>${item.ad}</span><span>${item.fiyat} TL</span></div>`;
            total += item.fiyat;
        });

        totalDisp.innerText = total + " TL";
    }

    function clearCart() {
        sepet = [];
        renderCart();
    }
</script>

</body>
</html>
