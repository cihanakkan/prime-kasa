<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prime Store Akıllı Kasa</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #000; color: white; overflow: hidden; }
        #video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover; background: #222; }
        .ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        .header { background: rgba(0,0,0,0.85); padding: 15px; text-align: center; pointer-events: auto; border-bottom: 3px solid #1a73e8; }
        .scan-box { width: 75%; height: 180px; border: 3px solid #00ff00; margin: auto; position: relative; border-radius: 15px; }
        .laser { width: 100%; height: 3px; background: red; position: absolute; top: 0; animation: move 2s linear infinite; }
        @keyframes move { 0% {top:0} 50% {top:100%} 100% {top:0} }
        .footer { background: white; color: black; padding: 20px; border-radius: 25px 25px 0 0; pointer-events: auto; max-height: 50%; overflow-y: auto; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .remove-btn { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 8px; }
        .total-row { font-size: 24px; font-weight: 900; display: flex; justify-content: space-between; margin: 15px 0; color: #1a73e8; }
        button.main { background: #1a73e8; color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<div class="ui">
    <div class="header">
        <h2 style="margin:0;">PRIME STORE 🏪</h2>
        <div id="status" style="color:#00ff00;">YENİ ÜRÜN ÖĞRENEBİLİR</div>
    </div>
    <div class="scan-box"><div class="laser"></div></div>
    <div class="footer">
        <div id="cart-list"><p style="text-align:center; color:#999;">Barkod okutunca otomatik sorar...</p></div>
        <div class="total-row"><span>TOPLAM:</span><span id="total-price">0 TL</span></div>
        <button class="main" onclick="window.print()">FİŞİ YAZDIR</button>
    </div>
</div>

<script>
    // Tarayıcının hafızasında kayıtlı ürünleri al veya boş liste başlat
    let urunler = JSON.parse(localStorage.getItem('primeUrunler')) || {};
    let sepet = [];
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let isLocked = false;

    codeReader.decodeFromVideoDevice({ facingMode: "environment" }, 'video', (result) => {
        if (result && !isLocked) {
            isLocked = true;
            const kod = result.text;
            
            if (urunler[kod]) {
                // Ürünü tanıyorsa direkt ekle
                if (navigator.vibrate) navigator.vibrate(100);
                addItem(kod);
            } else {
                // Ürünü tanımıyorsa sor
                if (navigator.vibrate) navigator.vibrate(200);
                const ad = prompt("Bu yeni bir ürün! İsmi ne olsun?");
                const fiyat = prompt(ad + " ürününün fiyatı ne kadar?");
                
                if (ad && fiyat) {
                    urunler[kod] = { ad: ad, fiyat: parseInt(fiyat) };
                    localStorage.setItem('primeUrunler', JSON.stringify(urunler)); // Telefonun hafızasına kaydet
                    addItem(kod);
                }
            }
            setTimeout(() => { isLocked = false; }, 2000);
        }
    });

    function addItem(kod) {
        sepet.push({ ...urunler[kod], id: Date.now() });
        renderCart();
    }

    function removeItem(id) {
        sepet = sepet.filter(item => item.id !== id);
        renderCart();
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        const totalDisp = document.getElementById('total-price');
        list.innerHTML = "";
        let total = 0;
        sepet.forEach(item => {
            list.innerHTML += `<div class="product-item"><span>${item.ad}</span><span>${item.fiyat} TL <button class="remove-btn" onclick="removeItem(${item.id})">X</button></span></div>`;
            total += item.fiyat;
        });
        totalDisp.innerText = total + " TL";
    }
</script>
</body>
</html>
