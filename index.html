<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prime Store Kasa v5</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background: #000; color: white; overflow: hidden; }
        #video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover; background: #1a1a1a; }
        .ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        .header { background: rgba(0,0,0,0.8); padding: 15px; text-align: center; pointer-events: auto; border-bottom: 2px solid #1a73e8; }
        .scan-box { width: 80%; height: 180px; border: 3px solid #00ff00; margin: auto; position: relative; border-radius: 15px; box-shadow: 0 0 20px rgba(0,255,0,0.5); }
        .laser { width: 100%; height: 3px; background: red; position: absolute; top: 0; animation: move 2s linear infinite; box-shadow: 0 0 10px red; }
        @keyframes move { 0% {top:0} 50% {top:100%} 100% {top:0} }
        .footer { background: white; color: black; padding: 20px; border-radius: 25px 25px 0 0; pointer-events: auto; max-height: 50%; overflow-y: auto; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; font-weight: bold; }
        .remove-btn { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
        .total-row { font-size: 24px; font-weight: 900; display: flex; justify-content: space-between; margin: 15px 0; color: #1a73e8; border-top: 2px solid #eee; padding-top: 10px; }
        .print-btn { background: #1a73e8; color: white; border: none; padding: 18px; border-radius: 12px; width: 100%; font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .clear-btn { background: #f1f3f4; color: #555; border: none; padding: 10px; border-radius: 10px; width: 100%; font-size: 12px; }
        #status { font-size: 12px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<div class="ui">
    <div class="header">
        <h2 style="margin:0;">PRIME STORE 🏪</h2>
        <div id="status" style="color:#00ff00;">SİSTEM HAZIR</div>
    </div>

    <div class="scan-box"><div class="laser"></div></div>

    <div class="footer">
        <div id="cart-list"><p style="text-align:center; color:#999; font-style: italic;">Barkod okutunca otomatik eklenir...</p></div>
        <div class="total-row"><span>TOPLAM:</span><span id="total-price">0 TL</span></div>
        <button class="print-btn" onclick="window.print()">FİŞİ YAZDIR (PIRANHA)</button>
        <button class="clear-btn" onclick="clearCart()">SEPETİ BOŞALT</button>
    </div>
</div>

<script>
    // Tarayıcı hafızasından ürünleri al (önceden kaydettiysen silinmez)
    let urunler = JSON.parse(localStorage.getItem('primeUrunler')) || {
        "123456": { ad: "Örnek Ürün", fiyat: 50 }
    };
    
    let sepet = [];
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let isLocked = false;

    // Kamerayı ve okuyucuyu başlat
    async function startKasa() {
        try {
            codeReader.decodeFromVideoDevice({ facingMode: "environment" }, 'video', (result) => {
                if (result && !isLocked) {
                    isLocked = true;
                    const kod = result.text.trim();
                    
                    if (urunler[kod]) {
                        if (navigator.vibrate) navigator.vibrate(100);
                        sepet.push({ ...urunler[kod], id: Date.now() });
                        renderCart();
                    } else {
                        // Ürün bilinmiyorsa sor
                        if (navigator.vibrate) navigator.vibrate(200);
                        const ad = prompt("Bilinmeyen Barkod: " + kod + "\nÜrün İsmi:");
                        const fiyat = prompt(ad + " Fiyatı (Sadece Sayı):");
                        
                        if (ad && fiyat) {
                            urunler[kod] = { ad: ad, fiyat: parseInt(fiyat) };
                            localStorage.setItem('primeUrunler', JSON.stringify(urunler));
                            sepet.push({ ...urunler[kod], id: Date.now() });
                            renderCart();
                        }
                    }
                    // 1.5 saniye bekle ki aynı şeyi 10 kere okumasın
                    setTimeout(() => { isLocked = false; }, 1500);
                }
            });
        } catch (err) {
            document.getElementById('status').innerText = "HATA: Kamera İzni Yok!";
            document.getElementById('status').style.color = "red";
        }
    }

    function removeItem(id) {
        sepet = sepet.filter(item => item.id !== id);
        renderCart();
    }

    function clearCart() {
        if(confirm("Tüm sepet silinsin mi?")) {
            sepet = [];
            renderCart();
        }
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        const totalDisp = document.getElementById('total-price');
        list.innerHTML = "";
        let total = 0;
        
        if (sepet.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#999; font-style: italic;">Barkod okutunca otomatik eklenir...</p>';
        }

        sepet.forEach(item => {
            list.innerHTML += `
                <div class="product-item">
                    <span>${item.ad}</span>
                    <span>${item.fiyat} TL <button class="remove-btn" onclick="removeItem(${item.id})">SİL</button></span>
                </div>`;
            total += item.fiyat;
        });
        totalDisp.innerText = total + " TL";
    }

    window.onload = startKasa;
</script>
</body>
</html>
