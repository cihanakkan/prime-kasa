<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Store Kasa</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; }
        #video { width: 100%; height: 60vh; background: #222; object-fit: cover; }
        .footer { background: #fff; color: #000; padding: 20px; position: fixed; bottom: 0; width: 100%; border-radius: 20px 20px 0 0; box-sizing: border-box; }
        .btn { background: #1a73e8; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <h2 style="padding: 10px;">PRIME STORE 🏪</h2>
    <video id="video" autoplay playsinline></video>
    <p id="status" style="color: yellow;">Kamera Başlatılıyor...</p>

    <div class="footer">
        <div id="cart">Barkod okutun...</div>
        <button class="btn" onclick="location.reload()">KAMERAYI TEKRAR DENE</button>
        <button class="btn" style="background:#555;" onclick="window.print()">FİŞ ÇIKAR</button>
    </div>

    <script>
        const codeReader = new ZXing.BrowserMultiFormatReader();
        const videoElement = document.getElementById('video');
        const status = document.getElementById('status');

        // EN BASİT KAMERA ÇAĞIRMA YÖNTEMİ
        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                videoElement.srcObject = stream;
                status.innerText = "SİSTEM AKTİF - BARKOD GÖSTERİN";
                status.style.color = "#00ff00";

                codeReader.decodeFromVideoElement(videoElement, (result) => {
                    if (result) {
                        if (navigator.vibrate) navigator.vibrate(100);
                        alert("OKUNDU: " + result.text);
                    }
                });
            } catch (err) {
                status.innerText = "HATA: Kamera İzni Yok!";
                status.style.color = "red";
                console.error(err);
            }
        }
        window.onload = start;
    </script>
</body>
</html>
