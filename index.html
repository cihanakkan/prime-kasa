<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prime Store Kasa v9</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #000; color: white; overflow: hidden; }
        #video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover; background: #000; }
        .ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        .header { background: rgba(0,0,0,0.85); padding: 15px; text-align: center; pointer-events: auto; border-bottom: 3px solid #1a73e8; }
        .scan-box { width: 80%; height: 180px; border: 3px solid #00ff00; margin: auto; position: relative; border-radius: 15px; box-shadow: 0 0 20px rgba(0,255,0,0.5); }
        .laser { width: 100%; height: 3px; background: red; position: absolute; top: 0; animation: move 2s linear infinite; }
        @keyframes move { 0% {top:0} 50% {top:100%} 100% {top:0} }
        .footer { background: white; color: black; padding: 20px; border-radius: 25px 25px 0 0; pointer-events: auto; max-height: 50%; overflow-y: auto; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; font-weight: bold; }
        .remove-btn { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 8px; }
        .total-row { font-size: 24px; font-weight: 900; display: flex; justify-content: space-between; margin: 10px 0; color: #1a73e8; }
        button.main { background: #1a73e8; color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; }
        .cam-btn { background: #ff9800; color: white; border: none; padding: 10px; border-radius: 8px; margin-top: 5px; width: 100%; font-weight: bold; pointer-events: auto; }
    </style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<div class="ui">
    <div class="header">
        <h2 style="margin:0;">PRIME STORE 🏪</h2>
        <button id="start-btn" class="cam-btn" onclick="initKamera()">📷 KAMERAYI BAŞLAT (TIKLA)</button>
    </div>

    <div class="scan-box"><div class="laser"></div></div>

    <div class="footer">
        <div id="cart-list"><p style="text-align:center; color:#999;">Önce kamerayı başlatın...</p></div>
        <div class="total-row"><span>TOPLAM:</span><span id="total-price">0 TL</span></div>
        <button class="main" onclick="window.print()">FİŞİ YAZDIR (PIRANHA)</button>
    </div>
</div>

<script>
    const urunler = { "20141985": { ad: "Özel Ürün", fiyat: 100 } };
    let sepet = [];
    const codeReader = new ZXing.BrowserMultiFormatReader();

    async function initKamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('video').srcObject = stream;
            document.getElementById('start-btn').style.display = "none";
            
            codeReader.decodeFromVideoDevice(null, 'video', (result) => {
                if (result) {
                    const kod = result.text.trim();
                    if (urunler[kod]) {
                        sepet.push({ ...urunler[kod], cartId: Date.now() });
                        renderCart();
                    } else {
                        const ad = prompt("Yeni Barkod (" + kod + ")\nİsim:");
                        const fiyat = prompt("Fiyat:");
                        if (ad && fiyat) {
                            urunler[kod] = { ad: ad, fiyat: parseInt(fiyat) };
                            sepet.push({ ...urunler[kod], cartId: Date.now() });
                            renderCart();
                        }
                    }
                }
            });
        } catch (err) {
            alert("Kamera hatası: " + err.message + "\nLütfen ayarlardan Chrome'a kamera izni ver.");
        }
    }

    function removeItem(id) {
        sepet = sepet.filter(i => i.cartId !== id);
        renderCart();
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        list.innerHTML = "";
        let total = 0;
        sepet.forEach(item => {
            list.innerHTML += `<div class="product-item"><span>${item.ad}</span><span>${item.fiyat} TL <button class="remove-btn" onclick="removeItem(${item.cartId})">X</button></span></div>`;
            total += item.fiyat;
        });
        document.getElementById('total-price').innerText = total + " TL";
    }
</script>
</body>
</html>
