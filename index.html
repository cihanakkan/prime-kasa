<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prime Store Mobil Kasa</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, sans-serif; margin: 0; background: #000; color: white; overflow: hidden; }
        
        /* Kamera Ekranı */
        #video { 
            position: fixed; right: 0; bottom: 0; 
            min-width: 100%; min-height: 100%; 
            z-index: -1; object-fit: cover; 
            background: #111; 
        }

        /* Arayüz Katmanları */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        
        .header { background: rgba(0,0,0,0.8); padding: 15px; text-align: center; pointer-events: auto; border-bottom: 2px solid #1a73e8; }
        
        .scan-area { 
            width: 70%; height: 25%; 
            border: 3px solid #00ff00; 
            margin: auto; position: relative; 
            box-shadow: 0 0 50px rgba(0,255,0,0.3); 
            border-radius: 15px;
        }
        
        .laser { 
            width: 100%; height: 3px; 
            background: #ff0000; position: absolute; 
            top: 0; animation: scan 2s linear infinite; 
            box-shadow: 0 0 15px #ff0000;
        }
        
        @keyframes scan { 0% {top: 0%;} 50% {top: 100%;} 100% {top: 0%;} }

        .footer { 
            background: white; color: #333; 
            padding: 20px; border-radius: 25px 25px 0 0; 
            pointer-events: auto; max-height: 40%; 
            overflow-y: auto; box-shadow: 0 -10px 20px rgba(0,0,0,0.5); 
        }

        /* Ürün Listesi Tasarımı */
        .product-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; font-weight: 600; font-size: 16px; }
        .total-box { font-size: 24px; font-weight: 900; display: flex; justify-content: space-between; margin: 15px 0; color: #1a73e8; }
        
        button { background: #1a73e8; color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s; }
        button:active { transform: scale(0.95); background: #1557b0; }
        .clear-btn { background: #f1f3f4; color: #5f6368; margin-top: 10px; font-size: 14px; padding: 10px; }
    </style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<div class="ui-layer">
    <div class="header">
        <h2 style="margin:0;">PRIME STORE 🏪</h2>
        <div id="status" style="color: #00ff00; font-size: 12px; font-weight: bold; margin-top: 5px;">SİSTEM AKTİF</div>
    </div>

    <div class="scan-area">
        <div class="laser"></div>
    </div>

    <div class="footer">
        <div id="cart-list">
            <p style="text-align:center; color:#999;">Ürün bekleniyor...</p>
        </div>
        
        <div class="total-box">
            <span>TOPLAM:</span>
            <span id="total-price">0 TL</span>
        </div>

        <button onclick="window.print()">FİŞİ YAZDIR (PIRANHA)</button>
        <button class="clear-btn" onclick="clearCart()">SEPETİ BOŞALT</button>
    </div>
</div>

<script>
    // --- ÜRÜN LİSTEN (İSTEDİĞİN GİBİ EKLE/ÇIKAR) ---
    const urunVeritabani = {
        "01": { ad: "Sakız", fiyat: 5 },
        "02": { ad: "Hot Wheels Araba", fiyat: 150 },
        "03": { ad: "Enerji İçeceği", fiyat: 40 },
        "12345678": { ad: "Deneme Ürünü", fiyat: 100 }
    };

    let sepet = [];
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let canScan = true;

    // Kamerayı ve Okuyucuyu Başlat
    async function initKasa() {
        try {
            // Arka kamerayı (environment) hedefle
            const constraints = { video: { facingMode: "environment" } };
            
            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                if (result && canScan) {
                    canScan = false; // Üst üste okumayı engelle
                    const kod = result.text;
                    
                    if (urunVeritabani[kod]) {
                        if (navigator.vibrate) navigator.vibrate(150); // Okuyunca titret
                        sepet.push(urunVeritabani[kod]);
                        renderCart();
                    } else {
                        console.log("Bilinmeyen barkod: " + kod);
                    }

                    // 2 saniye bekle ve sonraki barkoda geç
                    setTimeout(() => { canScan = true; }, 2000);
                }
            });
            document.getElementById('status').innerText = "TARAMA HAZIR";
        } catch (e) {
            document.getElementById('status').innerText = "HATA: Kamera Erişimi Yok!";
            document.getElementById('status').style.color = "red";
        }
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        const totalDisp = document.getElementById('total-price');
        list.innerHTML = "";
        let total = 0;

        if (sepet.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#999;">Ürün bekleniyor...</p>';
        }

        sepet.forEach((item, index) => {
            list.innerHTML += `<div class="product-item"><span>${item.ad}</span><span>${item.fiyat} TL</span></div>`;
            total += item.fiyat;
        });

        totalDisp.innerText = total + " TL";
    }

    function clearCart() {
        if(confirm("Sepet temizlensin mi?")) {
            sepet = [];
            renderCart();
        }
    }

    // Uygulama yüklendiğinde kamerayı aç
    window.onload = initKasa;
</script>

</body>
</html>
