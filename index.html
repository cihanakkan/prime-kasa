<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prime Store Kasa - Kesin Çözüm</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        #video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        .header { background: rgba(0,0,0,0.8); padding: 20px; text-align: center; pointer-events: auto; border-bottom: 2px solid #1a73e8; }
        .scan-area { width: 80%; height: 200px; border: 2px solid #00ff00; margin: auto; position: relative; border-radius: 10px; }
        .laser { width: 100%; height: 2px; background: red; position: absolute; top: 50%; box-shadow: 0 0 10px red; }
        .footer { background: white; color: black; padding: 20px; border-radius: 20px 20px 0 0; pointer-events: auto; max-height: 40%; overflow-y: auto; }
        .total { font-size: 24px; font-weight: bold; display: flex; justify-content: space-between; margin: 10px 0; color: #1a73e8; }
        .btn { background: #1a73e8; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 18px; }
        #error-msg { color: red; font-size: 14px; background: white; padding: 5px; display: none; pointer-events: auto; }
    </style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<div class="overlay">
    <div class="header">
        <h2 style="margin:0;">PRIME STORE 🏪</h2>
        <div id="status">Kamera Bağlanıyor...</div>
        <div id="error-msg"></div>
    </div>

    <div class="scan-area"><div class="laser"></div></div>

    <div class="footer">
        <div id="cart">Ürün bekleniyor...</div>
        <div class="total"><span>TOPLAM:</span><span id="total-price">0 TL</span></div>
        <button class="btn" onclick="location.reload()">KAMERAYI SIFIRLA</button>
    </div>
</div>

<script>
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let sepet = [];

    async function baslat() {
        try {
            // Kameraları listele ve arka kamerayı zorla
            const cihazlar = await codeReader.listVideoInputDevices();
            const arkaKamera = cihazlar.find(d => d.label.toLowerCase().includes('back')) || cihazlar[0];
            
            codeReader.decodeFromVideoDevice(arkaKamera.deviceId, 'video', (result, err) => {
                if (result) {
                    if (navigator.vibrate) navigator.vibrate(100);
                    // Barkod okununca yapılacaklar
                    const kod = result.text;
                    alert("OKUNDU: " + kod);
                }
            });
            document.getElementById('status').innerText = "SİSTEM AKTİF ✅";
        } catch (err) {
            console.error(arkaKamera);
            document.getElementById('error-msg').style.display = "block";
            document.getElementById('error-msg').innerText = "HATA: " + err.message;
            document.getElementById('status').innerText = "Kamera Başarısız ❌";
        }
    }

    window.onload = baslat;
</script>

</body>
</html>
